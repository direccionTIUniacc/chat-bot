<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIACC ChatBot - Demo TypeScript</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-message { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .chat-background {
            background-color: #f0f2f5;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.15) 1px, transparent 0);
            background-size: 20px 20px;
        }
        
        .message-bubble-user {
            background: #dcf8c6;
            border-radius: 18px 18px 4px 18px;
            padding: 8px 12px;
            margin: 4px 0;
            align-self: flex-end;
            max-width: 70%;
        }
        
        .message-bubble-bot {
            background: white;
            border-radius: 18px 18px 18px 4px;
            padding: 8px 12px;
            margin: 4px 0;
            align-self: flex-start;
            max-width: 70%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        .message-time {
            font-size: 11px;
            color: #667;
            margin-top: 4px;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-purple-50 p-4">
        <!-- Header -->
        <div class="bg-white rounded-t-lg shadow-lg border border-gray-200 p-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-blue-600 mb-2">🎓 UNIACC ChatBot MVP</h1>
                <p class="text-gray-600">Asistente virtual para captura de prospectos universitarios</p>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="bg-white border-x border-gray-200" style="min-height: 400px;">
            <div class="p-4 bg-blue-50 border-b">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center">
                    💬 Chat Interactivo
                </h2>
            </div>
            
            <!-- Chat Area -->
            <div id="results" class="chat-background p-4 overflow-y-auto flex flex-col space-y-2" style="height: 400px;">
                <div class="text-center text-gray-500 text-sm">
                    💬 Escribe "hola" para comenzar la conversación...
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="bg-white rounded-b-lg border-x border-b border-gray-200 p-4">
            <div class="flex gap-2">
                <input type="text" id="messageInput" placeholder="Escribe un mensaje (ej: hola)" 
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="sendBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold transition-colors">
                    Enviar
                </button>
            </div>
            
            <!-- Testing Buttons -->
            <div class="mt-4 space-x-2" id="testButtons">
                <!-- Buttons will be added dynamically -->
            </div>
        </div>
    </div>

    <!-- TypeScript will be compiled to JavaScript -->
    <script src="/js/chat-demo.js"></script>
</body>
</html>
